name: Cron · Notas fiscais

on:
  schedule:
    # A cada 10 min: confere notas em processamento e emite as que faltam
    - cron: '*/10 * * * *'
  workflow_dispatch: # permite rodar manualmente

permissions: {}

jobs:
  nfe:
    name: Notas fiscais
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Chamar API de notas fiscais
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://mikma.com.br/api/cron/nfe)

          echo "HTTP status: $STATUS"
          echo "Resposta:"
          cat /tmp/response.json

          if [ "$STATUS" != "200" ]; then
            echo "Erro: status $STATUS"
            exit 1
          fi

