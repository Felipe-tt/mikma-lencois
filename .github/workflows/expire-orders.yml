name: Cron · Expirar pedidos sem pagamento

on:
  schedule:
    # A cada 15 min: confere PIX vencido na AbacatePay e libera o estoque
    - cron: '*/15 * * * *'
  workflow_dispatch: # permite rodar manualmente

permissions: {}

jobs:
  expire-orders:
    name: Expirar pedidos sem pagamento
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Só estes destinos: qualquer outro é bloqueado (um pacote ou ação
          # comprometido não consegue mandar os segredos para fora).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            *.blob.core.windows.net:443
            mikma.com.br:443

      - name: Chamar API de expiração
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://mikma.com.br/api/cron/expire-orders)

          echo "HTTP status: $STATUS"
          echo "Resposta:"
          cat /tmp/response.json

          if [ "$STATUS" != "200" ]; then
            echo "Erro: status $STATUS"
            exit 1
          fi

