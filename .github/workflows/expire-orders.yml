name: Cron · Expirar pedidos sem pagamento

on:
  schedule:
    # A cada 15 min: confere PIX vencido na AbacatePay e libera o estoque
    - cron: '*/15 * * * *'
  workflow_dispatch: # permite rodar manualmente

permissions: {}

jobs:
  expire-orders:
    name: Expirar pedidos sem pagamento
    runs-on: ubuntu-latest
    steps:
      - name: Chamar API de expiração
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://mikma.com.br/api/cron/expire-orders)

          echo "HTTP status: $STATUS"
          echo "Resposta:"
          cat /tmp/response.json

          if [ "$STATUS" != "200" ]; then
            echo "Erro: status $STATUS"
            exit 1
          fi

      # Mesmo agendamento: avisa quem pediu "avise-me quando chegar" dos
      # produtos que voltaram ao estoque. Falha aqui não derruba o job.
      - name: Avisar produtos que voltaram ao estoque
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /tmp/alerts.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://mikma.com.br/api/cron/stock-alerts)
          echo "HTTP status: $STATUS"
          cat /tmp/alerts.json
          [ "$STATUS" = "200" ]
