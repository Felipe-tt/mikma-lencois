name: Firestore · backup diário

# Cópia do banco inteiro (menos coleções descartáveis), comprimida e
# criptografada com BACKUP_KEY. Fica como artifact por 14 dias e some
# sozinha: grátis (repositório público) e sem armazenamento pago no Google.
# Disparado pelo Worker mikma-cron às 06:00 UTC; o agendamento abaixo é
# reserva. Restaurar: scripts/firestore-restore.mjs (ver cabeçalho).

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      limpar_antigos:
        description: 'Em vez do backup: apagar documentos temporários antigos sem expireAt (scripts/firestore-limpar-antigos.mjs)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # identidade federada no Google Cloud

concurrency:
  group: backup-firestore
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Só estes destinos: qualquer outro é bloqueado (um pacote ou ação
          # comprometido não consegue mandar os segredos para fora).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            *.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Dependências (sem scripts de instalação)
        run: npm ci --ignore-scripts

      # Entra no Google Cloud pela identidade federada: token de curta duração
      # emitido para este repositório, sem chave JSON guardada no GitHub.
      - name: Entrar no Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: mikma-lencois
          workload_identity_provider: projects/915579306587/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@mikma-lencois.iam.gserviceaccount.com

      - name: Limpar temporários antigos
        if: ${{ inputs.limpar_antigos }}
        run: node scripts/firestore-limpar-antigos.mjs --aplicar

      - name: Backup
        if: ${{ !inputs.limpar_antigos }}
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          if [ -z "$BACKUP_KEY" ]; then echo "::error::Falta o secret BACKUP_KEY (senha do backup)"; exit 1; fi
          umask 077
          dia=$(date -u +%Y-%m-%d)
          node scripts/firestore-backup.mjs "$RUNNER_TEMP/firestore-$dia.mikmabk"
          # Confere que o arquivo abre com a senha antes de guardar.
          node scripts/firestore-restore.mjs "$RUNNER_TEMP/firestore-$dia.mikmabk" | head -1
          echo "DIA=$dia" >> "$GITHUB_ENV"

      - name: Guardar por 14 dias
        if: ${{ !inputs.limpar_antigos }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firestore-${{ env.DIA }}
          path: ${{ runner.temp }}/firestore-${{ env.DIA }}.mikmabk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
