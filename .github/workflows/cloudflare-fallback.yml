name: Cloudflare · fallback automático

# Se a Cloudflare cair, o site passa a ser servido direto pelo App Hosting e
# volta para trás da Cloudflare sozinho quando ela se recupera (ver
# scripts/cloudflare-fallback.sh). Uma vez por dia confere a validade do
# certificado da origem. Repositório público: Actions não custa nada.

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '41 11 * * *'
  workflow_dispatch:
    inputs:
      acao:
        description: 'auto (checa), ativar ou desativar o fallback, certificado'
        type: choice
        options: [auto, ativar, desativar, certificado]
        default: auto

permissions:
  id-token: write # identidade federada no Google Cloud

concurrency:
  group: cloudflare-fallback
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/cloudflare-fallback.sh
          sparse-checkout-cone-mode: false
      # Entra no Google Cloud pela identidade federada: token de curta duração
      # emitido para este repositório, sem chave JSON guardada no GitHub.
      - name: Entrar no Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: mikma-lencois
          workload_identity_provider: projects/915579306587/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@mikma-lencois.iam.gserviceaccount.com

      - name: Checar
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACAO: ${{ github.event.schedule == '41 11 * * *' && 'certificado' || inputs.acao || 'auto' }}
        run: bash scripts/cloudflare-fallback.sh "$ACAO"
