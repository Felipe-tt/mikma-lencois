name: CI Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # A correção automática de vulnerabilidades (seguranca-auditoria.yml) abre o
  # PR pelo GITHUB_TOKEN, que não dispara este check obrigatório: ela o
  # dispara na branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run checks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="$(git merge-base origin/main HEAD)"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          chmod +x scripts/repo-checks.sh
          scripts/repo-checks.sh "$BASE" "$HEAD"
