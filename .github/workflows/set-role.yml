name: Definir role de usuário (bootstrap admin)

# Só workflow_dispatch: só quem tem acesso de escrita no repo consegue
# disparar isso. É o único jeito de criar o primeiro admin, já que o
# painel em si exige ser admin pra promover qualquer pessoa (ver
# /api/painel/team), sem isso ninguém conseguiria começar.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'E-mail da conta (precisa já ter feito login/cadastro no site pelo menos uma vez)'
        required: true
      role:
        description: 'Nova role'
        required: true
        type: choice
        options:
          - admin
          - seller
          - buyer

permissions:
  contents: read
  id-token: write # identidade federada no Google Cloud

jobs:
  set-role:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      # Versão do package-lock (fixada), sem scripts de instalação.
      - name: Instalar firebase-admin
        run: npm ci --ignore-scripts

      # Entra no Google Cloud pela identidade federada: token de curta duração
      # emitido para este repositório, sem chave JSON guardada no GitHub.
      - name: Entrar no Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: mikma-lencois
          workload_identity_provider: projects/915579306587/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@mikma-lencois.iam.gserviceaccount.com

      - name: Definir role
        env:
          FIREBASE_PROJECT_ID: mikma-lencois
          TARGET_EMAIL: ${{ inputs.email }}
          TARGET_ROLE: ${{ inputs.role }}
        run: node scripts/set-role.mjs
