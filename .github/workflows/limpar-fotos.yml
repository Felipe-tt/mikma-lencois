name: Storage · limpar fotos sem uso

# Rodado manualmente. Sem "apagar", só lista as fotos de produto que nenhum
# documento do Firestore usa (ver scripts/limpar-fotos-orfas.mjs). Com
# "metadados", confere (ou regrava, junto com "apagar") as fotos que ainda
# têm EXIF/GPS (ver scripts/limpar-metadados-fotos.mjs).

on:
  workflow_dispatch:
    inputs:
      apagar:
        description: 'Apagar as fotos sem uso (sem isso, só lista)'
        type: boolean
        default: false
      metadados:
        description: 'Tirar metadados (EXIF, GPS) das fotos em vez de procurar fotos sem uso'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # identidade federada no Google Cloud

jobs:
  limpar:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Entra no Google Cloud pela identidade federada: token de curta duração
      # emitido para este repositório, sem chave JSON guardada no GitHub.
      - name: Entrar no Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: mikma-lencois
          workload_identity_provider: projects/915579306587/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@mikma-lencois.iam.gserviceaccount.com

      - name: Limpar fotos
        env:
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          APAGAR: ${{ inputs.apagar }}
          METADADOS: ${{ inputs.metadados }}
        run: |
          if [ "$METADADOS" = "true" ]; then
            node scripts/limpar-metadados-fotos.mjs $([ "$APAGAR" = "true" ] && echo --apply)
          elif [ "$APAGAR" = "true" ]; then
            node scripts/limpar-fotos-orfas.mjs --apply
          else
            node scripts/limpar-fotos-orfas.mjs
          fi
