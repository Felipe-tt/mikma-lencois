name: Domínio · DNSSEC, CAA, e-mail e HSTS

# Blindagem do mikma.com.br, tudo grátis. Sem "aplicar", só mostra o estado.
# Com "aplicar", cria só o que falta (nunca apaga registro; só endurece o DMARC):
# - DNSSEC na Cloudflare: depois, o registro DS mostrado no fim vai no registro.br;
# - CAA: só Let's Encrypt, Google, SSL.com, Sectigo e DigiCert emitem certificado;
# - DMARC (endurece p=none para quarantine com o DKIM da Resend) e SPF "-all" no raiz;
# - pede a inclusão na lista HSTS preload dos navegadores, se o site estiver apto.
# O token da Cloudflare precisa da permissão "Zone · DNS · Edit".

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Aplicar (sem isso, só mostra o estado)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dominio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APLICAR: ${{ inputs.aplicar }}
      DOMAIN: mikma.com.br
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Estado atual (DNS público)
        run: |
          for q in "TXT $DOMAIN" "MX $DOMAIN" "CAA $DOMAIN" "TXT _dmarc.$DOMAIN" "TXT resend._domainkey.$DOMAIN" "TXT send.$DOMAIN" "MX send.$DOMAIN"; do
            set -- $q; echo "## $1 $2"; dig +short "$1" "$2" @1.1.1.1 || true
          done
          echo "## DS no registro.br (DNSSEC ativo de ponta a ponta se aparecer algo)"
          dig +short DS "$DOMAIN" @a.dns.br || true
          echo "## HSTS preload"
          curl -s "https://hstspreload.org/api/v2/status?domain=$DOMAIN"; echo
          curl -s "https://hstspreload.org/api/v2/preloadable?domain=$DOMAIN"; echo

      - name: Cloudflare
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          Z=$(api "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" | jq -r '.result[0].id // empty')
          [ -n "$Z" ] || { echo "::error::Zona não encontrada com este token"; exit 1; }
          B="https://api.cloudflare.com/client/v4/zones/$Z"
          has() { api "$B/dns_records?type=$1&name=$2&per_page=100" | jq -r --arg c "${3:-}" '[.result[]? | select(($c == "") or ((.content // "") | contains($c)))] | length'; }

          echo "## DNSSEC"
          api "$B/dnssec" | jq -c '.result | {status, ds, key_tag, algorithm, digest_type, digest}'
          if [ "$APLICAR" = "true" ]; then
            st=$(api "$B/dnssec" | jq -r '.result.status')
            if [ "$st" != "active" ] && [ "$st" != "pending" ]; then
              api -X PATCH "$B/dnssec" --data '{"status":"active"}' | jq -c '{dnssec:.success,errors,status:.result.status}'
            fi
          fi

          echo "## CAA"
          if [ "$(has CAA "$DOMAIN")" = "0" ]; then
            if [ "$APLICAR" = "true" ]; then
              for ca in letsencrypt.org pki.goog ssl.com sectigo.com digicert.com; do
                for tag in issue issuewild; do
                  api -X POST "$B/dns_records" --data "{\"type\":\"CAA\",\"name\":\"$DOMAIN\",\"data\":{\"flags\":0,\"tag\":\"$tag\",\"value\":\"$ca\"}}" | jq -c "{caa:\"$tag $ca\",ok:.success,errors}"
                done
              done
            else echo "sem CAA (seria criado)"; fi
          else echo "CAA já existe: mantido"; fi

          echo "## DMARC"
          # Com a assinatura DKIM da Resend (d=mikma.com.br) o e-mail da loja passa
          # no DMARC; quem falsificar o domínio vai para o spam.
          if [ -n "$(dig +short TXT "resend._domainkey.$DOMAIN" @1.1.1.1)" ]; then pol="p=quarantine"; else pol="p=none"; fi
          dmarc="v=DMARC1; $pol; adkim=r; aspf=r; pct=100"
          rec=$(api "$B/dns_records?type=TXT&name=_dmarc.$DOMAIN&per_page=100" | jq -c '[.result[]? | select(.content | contains("v=DMARC1"))][0] // empty')
          if [ -z "$rec" ]; then
            if [ "$APLICAR" = "true" ]; then
              api -X POST "$B/dns_records" --data "{\"type\":\"TXT\",\"name\":\"_dmarc.$DOMAIN\",\"content\":\"\\\"$dmarc\\\"\",\"ttl\":3600}" | jq -c '{dmarc_criado:.success,errors}'
            else echo "sem DMARC (seria criado: $dmarc)"; fi
          elif echo "$rec" | jq -r .content | grep -q "p=none" && [ "$pol" = "p=quarantine" ]; then
            # Só observava (p=none): com o DKIM alinhado, passa a mandar o falso para o spam.
            if [ "$APLICAR" = "true" ]; then
              id=$(echo "$rec" | jq -r .id)
              api -X PATCH "$B/dns_records/$id" --data "{\"content\":\"\\\"$dmarc\\\"\"}" | jq -c '{dmarc_endurecido:.success,errors}'
            else echo "DMARC em p=none (seria endurecido: $dmarc)"; fi
          else echo "DMARC já protege: $(echo "$rec" | jq -r .content)"; fi

          echo "## SPF do domínio raiz"
          # O raiz só RECEBE e-mail (MX da Amazon SES, caixa de entrada da Resend);
          # o envio usa send.mikma.com.br, que tem o próprio SPF. "-all" no raiz
          # diz que ninguém envia com remetente técnico @mikma.com.br.
          if [ "$(has TXT "$DOMAIN" "v=spf1")" = "0" ]; then
            if [ "$APLICAR" = "true" ]; then
              api -X POST "$B/dns_records" --data "{\"type\":\"TXT\",\"name\":\"$DOMAIN\",\"content\":\"\\\"v=spf1 -all\\\"\",\"ttl\":3600}" | jq -c '{spf:.success,errors}'
            else echo "sem SPF no raiz (seria criado v=spf1 -all)"; fi
          else echo "SPF já existe: mantido"; fi

          echo "## MTA-STS e TLS-RPT (e-mail recebido só com TLS)"
          # A política fica em https://mta-sts.$DOMAIN (workers/mta-sts). O id
          # muda quando a política muda, para os servidores buscarem de novo.
          # Os relatórios TLS vão para relatorios@ e são descartados pelo
          # /api/email/inbound (só servem para olhar na Resend se der problema).
          sts="v=STSv1; id=20261028"
          rpt="v=TLSRPTv1; rua=mailto:relatorios@$DOMAIN"
          for pair in "_mta-sts.$DOMAIN|$sts|v=STSv1" "_smtp._tls.$DOMAIN|$rpt|v=TLSRPTv1"; do
            IFS='|' read -r name val tag <<< "$pair"
            rec=$(api "$B/dns_records?type=TXT&name=$name&per_page=100" | jq -c --arg t "$tag" '[.result[]? | select(.content | contains($t))][0] // empty')
            if [ -z "$rec" ]; then
              if [ "$APLICAR" = "true" ]; then
                api -X POST "$B/dns_records" --data "{\"type\":\"TXT\",\"name\":\"$name\",\"content\":\"\\\"$val\\\"\",\"ttl\":3600}" | jq -c "{registro:\"$name\",ok:.success,errors}"
              else echo "sem $name (seria criado: $val)"; fi
            elif [ "$(echo "$rec" | jq -r .content | tr -d '"')" != "$val" ] && [ "$APLICAR" = "true" ]; then
              api -X PATCH "$B/dns_records/$(echo "$rec" | jq -r .id)" --data "{\"content\":\"\\\"$val\\\"\"}" | jq -c "{atualizado:\"$name\",ok:.success,errors}"
            else echo "$name: $(echo "$rec" | jq -r .content)"; fi
          done
          curl -fsS "https://mta-sts.$DOMAIN/.well-known/mta-sts.txt" || echo "política MTA-STS ainda não publicada (worker-mta-sts.yml)"

          echo "## Registro DS para colar no registro.br (DNSSEC)"
          api "$B/dnssec" | jq -r '.result | "status: \(.status)\nKey tag (identificador): \(.key_tag)\nAlgoritmo: \(.algorithm)\nTipo de digest: \(.digest_type)\nDigest: \(.digest)"'

      - name: HSTS preload
        if: ${{ inputs.aplicar }}
        run: |
          errs=$(curl -s "https://hstspreload.org/api/v2/preloadable?domain=$DOMAIN" | jq '.errors | length')
          status=$(curl -s "https://hstspreload.org/api/v2/status?domain=$DOMAIN" | jq -r '.status')
          if [ "$status" = "unknown" ] && [ "$errs" = "0" ]; then
            curl -s -X POST "https://hstspreload.org/api/v2/submit?domain=$DOMAIN"; echo
          else
            echo "status: $status, erros: $errs (não enviado)"
          fi
