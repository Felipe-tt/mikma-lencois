name: Infra · manutenção do Google Cloud

# Rodado manualmente. Sem "aplicar", só lista (não muda nada):
# - repositórios do Artifact Registry e tamanho (imagens de build acumuladas);
# - backends do App Hosting, serviços do Cloud Run e funções;
# - se o secret ABACATEPAY_WEBHOOK_SECRET existe no Secret Manager.
# Com "aplicar":
# - política de limpeza no Artifact Registry (mantém as 5 imagens mais
#   recentes de cada pacote, apaga o resto com mais de 14 dias);
# - cria o ABACATEPAY_WEBHOOK_SECRET no Secret Manager a partir do secret do
#   GitHub (se ainda não existir) e dá acesso aos backends do App Hosting.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Aplicar as mudanças (sem isso, só lista)'
        type: boolean
        default: false
      cloudflare:
        description: 'Configurar a Cloudflare (SSL, firewall, limite de requisições, trava de origem, cache do HTML)'
        type: boolean
        default: false
      ttl_firestore:
        description: 'Ligar a limpeza automática (TTL) do Firestore nas coleções temporárias'
        type: boolean
        default: false
      mfa_totp:
        description: 'Ligar a verificação em duas etapas por app autenticador (TOTP) no Firebase Auth'
        type: boolean
        default: false
      login_convidado:
        description: 'Ligar o login anônimo no Firebase Auth (comprar sem criar conta)'
        type: boolean
        default: false
      verificar_ip:
        description: 'Testar em produção se o limite por IP resiste a IP forjado'
        type: boolean
        default: false
      apagar_ssr_antigo:
        description: 'Apagar a função SSR da hospedagem antiga (ssrmikmalencois), só se o domínio já estiver no App Hosting'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: mikma-lencois
      APLICAR: ${{ inputs.aplicar }}
      APAGAR_SSR: ${{ inputs.apagar_ssr_antigo }}
      CLOUDFLARE: ${{ inputs.cloudflare }}
      TTL: ${{ inputs.ttl_firestore }}
      MFA_TOTP: ${{ inputs.mfa_totp }}
      LOGIN_CONVIDADO: ${{ inputs.login_convidado }}
    steps:
      - name: Autenticar no Google Cloud
        run: |
          echo "$SA_JSON" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project "$PROJECT_ID"
        env:
          SA_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Artifact Registry
        run: |
          set +e
          echo "## Repositórios"
          gcloud artifacts repositories list --format='table(name.basename(),format,location,sizeBytes.size(zero="0",precision=1,units_out=G))'
          if [ "$APLICAR" = "true" ]; then
            cat > /tmp/policy.json <<'JSON'
          [
            {"name": "manter-5-recentes", "action": {"type": "Keep"}, "mostRecentVersions": {"keepCount": 5}},
            {"name": "apagar-antigas", "action": {"type": "Delete"}, "condition": {"olderThan": "14d"}}
          ]
          JSON
            gcloud artifacts repositories list --format='value(name.basename(),location,format)' | while read -r repo loc fmt; do
              [ "$fmt" = "DOCKER" ] || continue
              echo "Política de limpeza em $repo ($loc)"
              gcloud artifacts repositories set-cleanup-policies "$repo" --location="$loc" --policy=/tmp/policy.json --no-dry-run
            done
          fi

      - name: Firestore · limpeza automática (TTL)
        run: |
          set +e
          # Documentos temporários com expireAt (Timestamp). Com o TTL ligado,
          # o Firestore apaga sozinho depois da data (grátis, sem cron):
          # - webauthnChallenges: desafio de passkey (5 min);
          # - webhook_deliveries: anti-duplicidade do webhook (3 dias);
          # - trackingCache: rastreio dos Correios (3 dias sem consulta);
          # - geocache: coordenadas por CEP para o frete (30 dias).
          gcloud firestore fields ttls list --format='table(name,ttlConfig.state)' 2>&1 | head -10
          if [ "$TTL" = "true" ]; then
            for col in webauthnChallenges webhook_deliveries trackingCache geocache; do
              if gcloud firestore fields ttls update expireAt --collection-group=$col --enable-ttl --async; then
                echo "TTL pedido: $col"
              else
                echo "::warning::Sem permissão para o TTL de $col. A service account precisa do papel Cloud Datastore Index Admin (roles/datastore.indexAdmin)."
              fi
            done
          fi

      - name: Firebase Auth · login anônimo (checkout de convidado)
        run: |
          set +e
          # "Comprar sem criar conta" entra como usuário anônimo do Firebase.
          # Com o provedor desligado, o cadastro anônimo volta ADMIN_ONLY_OPERATION
          # e o botão de convidado não funciona (o pentest acusa isso).
          T=$(gcloud auth print-access-token)
          C="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT_ID/config"
          echo "Login anônimo agora: $(curl -sS -H "Authorization: Bearer $T" "$C" | jq -c '.signIn.anonymous // {enabled:false}')"
          if [ "$LOGIN_CONVIDADO" = "true" ]; then
            r=$(curl -sS -X PATCH -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              "$C?updateMask=signIn.anonymous.enabled" --data '{"signIn":{"anonymous":{"enabled":true}}}')
            echo "$r" | jq -c '{anonimo: .signIn.anonymous, error}'
            if echo "$r" | jq -e '.error' >/dev/null; then
              echo "::warning::Não liguei o login anônimo: $(echo "$r" | jq -r '.error.message')"
            fi
          fi

      - name: Firebase Auth · verificação em duas etapas (TOTP)
        run: |
          set +e
          # TOTP é do Identity Platform (grátis até 50 mil usuários ativos por
          # mês, sem SMS). Só quem cadastrar um app em /painel/seguranca passa
          # a ver o pedido do código; os clientes não mudam nada.
          T=$(gcloud auth print-access-token)
          C="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT_ID/config"
          curl -sS -H "Authorization: Bearer $T" "$C" | jq -c '{mfa, identityPlatform: (.subtype // "firebase")}'
          if [ "$MFA_TOTP" = "true" ]; then
            ligar() {
              curl -sS -X PATCH -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$C?updateMask=mfa" \
                --data '{"mfa":{"state":"ENABLED","providerConfigs":[{"state":"ENABLED","totpProviderConfig":{"adjacentIntervals":5}}]}}'
            }
            r=$(ligar)
            # MFA exige o Firebase Auth com Identity Platform. O console nem
            # sempre mostra o botão de upgrade; a API faz o mesmo (usuários,
            # provedores e chaves continuam iguais).
            if echo "$r" | jq -r '.error.message // empty' | grep -qi 'upgraded\|GCIP'; then
              echo "Fazendo o upgrade para o Identity Platform"
              curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
                "https://identitytoolkit.googleapis.com/v2/projects/$PROJECT_ID/identityPlatform:initializeAuth" --data '{}' | jq -c .
              sleep 10
              r=$(ligar)
            fi
            echo "$r" | jq -c '{mfa, error}'
            if echo "$r" | jq -e '.error' >/dev/null; then
              echo "::warning::Não liguei o TOTP: $(echo "$r" | jq -r '.error.message')"
            fi
          fi

      - name: Serviços ligados (App Hosting, Cloud Run, funções)
        run: |
          set +e
          echo "## App Hosting"
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx -y firebase-tools@14 apphosting:backends:list --project "$PROJECT_ID"
          echo "## Cloud Run"
          gcloud run services list --format='table(metadata.name,region,status.url)'
          echo "## Cloud Functions"
          gcloud functions list --format='table(name,state,environment)' 2>&1 | head -40
          echo "## Config dos serviços (instâncias mínimas = custo fixo)"
          for svc in $(gcloud run services list --format='value(metadata.name,region)' | tr '\t' ':'); do
            name=${svc%%:*}; region=${svc##*:}
            echo "--- $name ($region)"
            gcloud run services describe "$name" --region "$region" --format='yaml(spec.template.metadata.annotations,spec.template.spec.containers[0].resources,spec.template.spec.serviceAccountName,status.traffic)' 2>&1 | head -30
          done
          echo "## Quem lê os secrets que funcionam (CRON_SECRET)"
          gcloud secrets get-iam-policy CRON_SECRET --format='yaml(bindings)' 2>&1 | head -20
          echo "## Quem lê ABACATEPAY_WEBHOOK_SECRET"
          gcloud secrets get-iam-policy ABACATEPAY_WEBHOOK_SECRET --format='yaml(bindings)' 2>&1 | head -20

      - name: Secret do webhook da AbacatePay
        env:
          WEBHOOK_SECRET: ${{ secrets.ABACATEPAY_WEBHOOK_SECRET }}
        run: |
          set +e
          if [ -n "$WEBHOOK_SECRET" ]; then echo "GitHub: ABACATEPAY_WEBHOOK_SECRET presente"; else echo "GitHub: ABACATEPAY_WEBHOOK_SECRET vazio/ausente"; fi
          if gcloud secrets describe ABACATEPAY_WEBHOOK_SECRET >/dev/null 2>&1; then
            echo "Secret Manager: ABACATEPAY_WEBHOOK_SECRET existe"
            EXISTE=1
          else
            echo "Secret Manager: ABACATEPAY_WEBHOOK_SECRET NÃO existe"
            EXISTE=0
          fi
          if [ "$APLICAR" = "true" ] && [ -n "$WEBHOOK_SECRET" ]; then
            if [ "$EXISTE" = "0" ]; then
              printf '%s' "$WEBHOOK_SECRET" | gcloud secrets create ABACATEPAY_WEBHOOK_SECRET --replication-policy=automatic --data-file=- && echo "criado"
            else
              printf '%s' "$WEBHOOK_SECRET" | gcloud secrets versions add ABACATEPAY_WEBHOOK_SECRET --data-file=- >/dev/null && echo "nova versão adicionada"
            fi
            # Mesmo acesso dos secrets que já funcionam (conta de serviço do App Hosting).
            for m in $(gcloud secrets get-iam-policy CRON_SECRET --format=json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);for(const b of p.bindings||[])if(b.role==="roles/secretmanager.secretAccessor")for(const m of b.members)console.log(m)})'); do
              echo "Acesso para $m"
              gcloud secrets add-iam-policy-binding ABACATEPAY_WEBHOOK_SECRET --member="$m" --role=roles/secretmanager.secretAccessor >/dev/null && echo ok
            done
            for b in $(GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx -y firebase-tools@14 apphosting:backends:list --project "$PROJECT_ID" --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).result||[];for(const b of r)console.log(String(b.name).split("/").pop())}catch{}})'); do
              echo "Acesso ao backend $b"
              GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx -y firebase-tools@14 apphosting:secrets:grantaccess ABACATEPAY_WEBHOOK_SECRET --backend "$b" --project "$PROJECT_ID"
            done
          fi

      - name: Quem serve mikma.com.br e servidor antigo
        run: |
          set +e
          # /api/painel/ip-check só existe no código novo (App Hosting): 401 = novo; 404 = antigo.
          novo=$(curl -s -o /dev/null -w '%{http_code}' https://mikma.com.br/api/painel/ip-check)
          antigo=$(curl -s -o /dev/null -w '%{http_code}' https://ssrmikmalencois-k62tgyyiyq-rj.a.run.app/api/painel/ip-check)
          echo "mikma.com.br/api/painel/ip-check -> $novo"
          echo "ssrmikmalencois/api/painel/ip-check -> $antigo"
          curl -sI https://mikma.com.br/ | grep -iE '^(server|via|x-fah|x-cloud|alt-svc)' || true
          if [ "$APAGAR_SSR" = "true" ]; then
            if [ "$novo" = "401" ]; then
              gcloud functions delete ssrmikmalencois --region southamerica-east1 --quiet && echo "função antiga apagada"
            else
              echo "Domínio não respondeu como o código novo ($novo): não apaguei a função antiga."
            fi
          fi

      - name: Cloudflare
        if: ${{ inputs.cloudflare }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ok() { jq -e '.success' >/dev/null; }
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=mikma.com.br" | jq -r '.result[0].id // empty')
          [ -n "$ZONE" ] || { echo "Zona mikma.com.br não encontrada (token sem acesso?)"; exit 1; }
          STATUS=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE" | jq -r '.result.status')
          echo "Zona: $STATUS"
          B="https://api.cloudflare.com/client/v4/zones/$ZONE"

          # SSL ponta a ponta com certificado válido na origem (App Hosting), HTTPS
          # sempre, TLS 1.3 e HTTP/3 (mais rápido no 4G), links http:// viram https://.
          for kv in 'ssl:"strict"' 'always_use_https:"on"' 'min_tls_version:"1.2"' 'browser_check:"on"' 'security_level:"medium"' 'tls_1_3:"on"' 'http3:"on"' 'automatic_https_rewrites:"on"' 'always_online:"on"'; do
            k=${kv%%:*}; v=${kv#*:}
            api -X PATCH "$B/settings/$k" --data "{\"value\":$v}" | jq -c '{setting:"'"$k"'",success,errors}'
          done

          # Só cifras modernas no TLS 1.2 (ECDHE com GCM/ChaCha20): tira as CBC
          # e as sem forward secrecy, que o testssl.sh marca (LUCKY13). O TLS 1.3
          # não é afetado. Se o plano não permitir, só avisa.
          api -X PATCH "$B/settings/ciphers" --data '{"value":["ECDHE-ECDSA-AES128-GCM-SHA256","ECDHE-ECDSA-CHACHA20-POLY1305","ECDHE-RSA-AES128-GCM-SHA256","ECDHE-RSA-CHACHA20-POLY1305","ECDHE-ECDSA-AES256-GCM-SHA384","ECDHE-RSA-AES256-GCM-SHA384"]}' | jq -c '{cifras:.success,errors}' || echo "::warning::não deu para limitar as cifras"

          # Always Online: se o site cair, a Cloudflare mostra a última cópia
          # salva das páginas da loja em vez de uma tela de erro.
          # Senha vazada: a Cloudflare compara o login com bases públicas de
          # vazamentos e manda o resultado no header Exposed-Credential-Check;
          # /api/auth/login pede confirmação por e-mail quando a senha vazou.
          api -X POST "$B/leaked-credential-checks" --data '{"enabled":true}' | jq -c '{senha_vazada:.success,errors}'
          api -X PATCH "$B/managed_headers" --data '{"managed_request_headers":[{"id":"add_leaked_credentials_checks_header","enabled":true}]}' | jq -c '{header_senha_vazada:.success,errors}'

          # Firewall: scanners de WordPress/PHP/arquivos ocultos são bloqueados na borda.
          api -X PUT "$B/rulesets/phases/http_request_firewall_custom/entrypoint" --data '{
            "rules": [{
              "description": "Bloqueia scanners",
              "expression": "(http.request.uri.path contains \"/wp-\") or (http.request.uri.path contains \".php\") or (http.request.uri.path contains \"/.env\") or (http.request.uri.path contains \"/.git\") or (http.request.uri.path contains \"xmlrpc\")",
              "action": "block"
            }]
          }' | jq -c '{firewall:.success,errors}'

          # Limite por IP nas APIs (fora webhooks e cron, que vêm de servidores).
          api -X PUT "$B/rulesets/phases/http_ratelimit/entrypoint" --data '{
            "rules": [{
              "description": "Limite nas APIs",
              "expression": "starts_with(http.request.uri.path, \"/api/\") and not starts_with(http.request.uri.path, \"/api/payment/webhook\") and not starts_with(http.request.uri.path, \"/api/shipping/uber-webhook\") and not starts_with(http.request.uri.path, \"/api/cron/\") and not starts_with(http.request.uri.path, \"/api/email/\")",
              "action": "block",
              "ratelimit": {"characteristics": ["ip.src", "cf.colo.id"], "period": 10, "requests_per_period": 80, "mitigation_timeout": 10}
            }]
          }' | jq -c '{ratelimit:.success,errors}'

          # Trava de origem: a Cloudflare manda um segredo; o site recusa quem chega sem ele.
          # Reaproveita o segredo se já existe (trocar exigiria novo deploy do site).
          if gcloud secrets describe EDGE_SHARED_SECRET >/dev/null 2>&1; then
            EDGE=$(gcloud secrets versions access latest --secret EDGE_SHARED_SECRET)
            echo "Segredo de origem: reaproveitado"
          else
            EDGE=$(openssl rand -hex 32)
            printf '%s' "$EDGE" | gcloud secrets create EDGE_SHARED_SECRET --replication-policy=automatic --data-file=- >/dev/null && echo "Segredo de origem: criado"
            gcloud secrets add-iam-policy-binding EDGE_SHARED_SECRET --member=serviceAccount:firebase-app-hosting-compute@mikma-lencois.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor >/dev/null && echo "acesso ok"
          fi
          echo "::add-mask::$EDGE"
          # Mesmo acesso dos secrets que já funcionam (build e runtime do App Hosting).
          # Sem o viewer e o papel do agente do App Hosting, o build falha no "preparer".
          gcloud secrets get-iam-policy CRON_SECRET --format=json | jq -r '.bindings[]? | .role as $r | .members[] | "\($r) \(.)"' | while read -r role m; do
            gcloud secrets add-iam-policy-binding EDGE_SHARED_SECRET --member="$m" --role="$role" >/dev/null && echo "acesso: $role $m"
          done
          api -X PUT "$B/rulesets/phases/http_request_late_transform/entrypoint" --data "{
            \"rules\": [{
              \"description\": \"Segredo de origem\",
              \"expression\": \"true\",
              \"action\": \"rewrite\",
              \"action_parameters\": {\"headers\": {\"x-mikma-edge\": {\"operation\": \"set\", \"value\": \"$EDGE\"}}}
            }]
          }" | jq -c '{transform:.success,errors}'

          # Cache do HTML da loja na borda. Quem decide o que guarda e por
          # quanto tempo é o site, pelo header Cloudflare-CDN-Cache-Control
          # (ver src/lib/edgeCache.ts: 2 min, nada em manutenção). A regra só
          # deixa o HTML elegível e tira daqui APIs, painel, arquivos do Next
          # e os pedidos internos do Next (RSC/prefetch), que têm outro
          # conteúdo na mesma URL e envenenariam o cache.
          api -X PUT "$B/rulesets/phases/http_request_cache_settings/entrypoint" --data '{
            "rules": [{
              "description": "HTML da loja em cache (o site decide o tempo)",
              "expression": "(http.request.method in {\"GET\" \"HEAD\"}) and not starts_with(http.request.uri.path, \"/api/\") and not starts_with(http.request.uri.path, \"/painel\") and not starts_with(http.request.uri.path, \"/_next/\") and not starts_with(http.request.uri.path, \"/monitoring\") and not (http.request.uri.query contains \"_rsc\") and not (http.cookie contains \"__session=\") and not any(lower(http.request.headers.names[*])[*] in {\"rsc\" \"next-router-prefetch\" \"next-router-state-tree\" \"next-router-segment-prefetch\" \"next-action\"})",
              "action": "set_cache_settings",
              "action_parameters": {
                "cache": true,
                "edge_ttl": {"mode": "respect_origin"},
                "browser_ttl": {"mode": "respect_origin"}
              }
            }]
          }' | jq -c '{cache_html:.success,errors}'

          echo "## DNS publicados pelo registro.br (servidor oficial do .br)"
          dig +norec NS mikma.com.br @a.dns.br | grep -E "IN\s+NS" || true
          echo "## DNS vistos pela internet (Google)"
          dig +short NS mikma.com.br @8.8.8.8 || true
          echo "## O domínio já passa pela Cloudflare?"
          curl -sI https://mikma.com.br/ | grep -iE '^(server|cf-ray)' || true

      - name: Limite por IP resiste a IP forjado?
        if: ${{ inputs.verificar_ip }}
        run: |
          # /api/stock aceita 60 consultas por minuto por IP. Mandando um IP
          # falso diferente a cada vez, o bloqueio só vem se o site usa o IP real.
          bloqueou=0
          for i in $(seq 1 70); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "fastly-client-ip: 10.0.$((i/250)).$((i%250))" -H "x-forwarded-for: 1.2.3.$i" "https://mikma.com.br/api/stock?skus=teste")
            [ "$code" = "429" ] && bloqueou=$((bloqueou+1))
          done
          echo "Respostas 429: $bloqueou de 70"
          if [ "$bloqueou" -gt 0 ]; then echo "OK: o IP forjado não engana o limite"; else echo "ATENÇÃO: limite não disparou"; fi

      - name: Último build com falha (App Hosting)
        continue-on-error: true
        run: |
          set +e
          id=$(gcloud builds list --region us-east4 --filter='status=FAILURE' --limit 1 --format='value(id)')
          gcloud builds list --region us-east4 --limit 3 --format='table(id,status,createTime)'
          [ -n "$id" ] && gcloud builds describe "$id" --region us-east4 --format='yaml(failureInfo,statusDetail,steps[].id,steps[].status,steps[].name)' 2>&1 | head -60
          for sec in CRON_SECRET ABACATEPAY_WEBHOOK_SECRET EDGE_SHARED_SECRET; do
            echo "--- $sec"
            gcloud secrets get-iam-policy "$sec" --format='yaml(bindings)'
            gcloud secrets versions list "$sec" --format='table(name,state)' | head -4
            gcloud secrets describe "$sec" --format='yaml(replication,labels,annotations)'
          done
