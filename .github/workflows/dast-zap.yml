name: DAST · OWASP ZAP

# Teste dinâmico de segurança no site no ar (mikma.com.br), modo baseline:
# o ZAP navega pelas páginas públicas por 1 minuto e só OBSERVA as
# respostas (headers, cookies, CSP, vazamento de informação). Não envia
# ataque nem formulário, então não cria pedido nem derruba nada.
# O relatório fica como artifact por 14 dias; não abre issue.
# Regras ignoradas e o motivo: .zap/rules.tsv.

on:
  schedule:
    - cron: '29 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-zap
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .zap

      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://mikma.com.br
          rules_file_name: .zap/rules.tsv
          cmd_options: '-m 1 -j'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-mikma
