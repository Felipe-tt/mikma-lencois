name: Atualizações · merge automático

# Atualização de dependência (Dependabot) e correção de vulnerabilidade
# (seguranca-auditoria.yml) entram sozinhas na main quando TODOS os checks do
# commit passaram: testes, regras do Firestore, build, e2e, CodeQL e a revisão
# de dependências. O App Hosting publica a main sozinho, e a rotina de saúde
# (saude-site.yml) volta a versão anterior se o site cair depois.
#
# Roda quando o workflow de deploy (o que tem o e2e) termina num PR. Não faz
# checkout nem roda o código do PR: só lê os checks e faz o merge pela API.
# PR de pessoa (ou de outro bot) nunca entra por aqui.

on:
  workflow_run:
    workflows: ["Deploy · Mikma Lençóis"]
    types: [completed]

permissions: {}

concurrency:
  group: atualizacoes-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # merge
      pull-requests: write  # merge
      actions: write        # rodar de novo o que falhou e disparar o teste da main
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Conferir os checks e fazer o merge
        run: |
          set -euo pipefail
          # Só branches de atualização automática...
          case "$BRANCH" in
            dependabot/*|deps/auditoria) ;;
            *) echo "Não é atualização automática."; exit 0 ;;
          esac
          pr="$(gh pr list --state open --head "$BRANCH" --json number,author,headRefOid,isDraft --jq '.[0] // empty')"
          if [ -z "$pr" ]; then echo "Sem PR aberto para a branch."; exit 0; fi
          num="$(jq -r .number <<<"$pr")"
          author="$(jq -r .author.login <<<"$pr")"
          # ...aberta por um dos bots de atualização, no mesmo commit testado.
          case "$author" in
            dependabot|app/dependabot|'dependabot[bot]'|github-actions|app/github-actions|'github-actions[bot]') ;;
            *) echo "PR #$num é de $author: fica para revisão."; exit 0 ;;
          esac
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$SHA" ]; then echo "PR #$num mudou depois deste teste."; exit 0; fi
          if [ "$(jq -r .isDraft <<<"$pr")" = "true" ]; then echo "PR #$num é rascunho."; exit 0; fi

          if [ "$CONCLUSION" != "success" ]; then
            # Falha passageira (rede, runner): roda de novo, uma vez, o que falhou.
            if [ "$CONCLUSION" = "failure" ] && [ "$ATTEMPT" = "1" ]; then
              gh run rerun "$RUN_ID" --failed && echo "PR #$num: rodando de novo o que falhou."
            else
              echo "PR #$num: os testes não passaram ($CONCLUSION). Fica aberta."
            fi
            exit 0
          fi

          # Os outros checks do mesmo commit (CodeQL, revisão de dependências...).
          checks() { gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" --jq "$1"; }
          for _ in $(seq 1 40); do
            [ "$(checks '[.check_runs[] | select(.status != "completed")] | length')" = "0" ] && break
            sleep 30
          done
          bad="$(checks '[.check_runs[] | select(.status != "completed" or ((.conclusion // "") | IN("success", "skipped", "neutral") | not)) | .name] | join(", ")')"
          if [ -n "$bad" ]; then echo "PR #$num: ainda sem passar: $bad. Fica aberta."; exit 0; fi

          title="$(gh pr view "$num" --json title --jq .title)"
          subject="$title (#$num)"
          [ "${#subject}" -le 72 ] || subject="build(deps): atualização automática (#$num)"
          if gh pr merge "$num" --squash --delete-branch --match-head-commit "$SHA" \
              --subject "$subject" --body "Merge automático: todos os checks passaram."; then
            echo "PR #$num: merge feito."
            # Merge feito pelo GITHUB_TOKEN não dispara workflows: roda a
            # validação na main (o site, o App Hosting publica sozinho).
            gh workflow run deploy.yml --ref main || echo "::warning::não disparou o teste da main"
          else
            echo "::warning::PR #$num: o merge não foi aceito agora (conflito ou regra da branch). O Dependabot refaz a PR e ela é testada de novo."
          fi
