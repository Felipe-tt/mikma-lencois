name: Deploy · Mikma Lençóis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Menor privilégio por padrão: o GITHUB_TOKEN só lê o conteúdo do repositório.
permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # ── 1) Validação: testes, regras do Firestore e build ──────────────────────
  # Este job é o check obrigatório "build-and-deploy" da regra do repositório e
  # roda em TODO evento (inclusive PRs). Ele NÃO recebe nenhum segredo de
  # produção. Antes, o job inteiro carregava FIREBASE_PRIVATE_KEY,
  # ABACATEPAY_API_KEY, RECAPTCHA_SECRET_KEY etc. e executava npm ci/test/build
  # do código do PR: qualquer pessoa capaz de abrir um PR (ou com um token
  # vazado) podia exfiltrar as chaves de produção editando um teste. O build
  # de produção passa com valores de mentira, porque só a parte NEXT_PUBLIC_*
  # (pública por natureza) é incorporada ao bundle e este workflow não publica
  # o site (quem faz isso é o App Hosting, com os segredos dele).
  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    env:
      # Placeholders: não são credenciais reais.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCiBuildPlaceholderNotARealKey000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:0:web:0
      FIREBASE_PROJECT_ID: ci-placeholder
      FIREBASE_CLIENT_EMAIL: ci-placeholder@ci-placeholder.iam.gserviceaccount.com
      NEXT_PUBLIC_APP_URL: https://mikma.com.br
      NEXT_PUBLIC_BASE_URL: https://mikma.com.br
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Rodar testes automatizados
        run: npm test

      - name: Lint (ESLint)
        run: npm run lint

      - name: Instalar JDK (exigido pelo emulador do Firestore)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Rodar testes das Firestore Rules
        run: npm run test:rules

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: nextjs-v3-webpack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.css', 'src/**/*.ts', 'src/**/*.tsx', 'tailwind.config.ts') }}
          # Sem restore-keys de propósito: um fallback por prefixo pode
          # restaurar um cache de webpack de um commit anterior quando o
          # hash exato não bate, e isso já causou pelo menos um chunk
          # compartilhado ficar desatualizado (código antigo servido em
          # produção mesmo após o fix estar no commit). Preferimos um
          # cache miss ocasional (build mais lenta) a servir código stale.

      - name: Build Next.js
        run: npm run build

  # ── 1a) Instala como o App Hosting: Node 24 sem Java ─────────────────────
  # O runner do GitHub já vem com JDK, então um pacote que precisa de Java no
  # "npm install" passava aqui e quebrava só no build do App Hosting (foi o
  # que aconteceu com a nota fiscal). Este job instala num container node:24,
  # que, como o builder do Google, não tem Java.
  instalar-como-app-hosting:
    name: instalar-como-app-hosting
    runs-on: ubuntu-latest
    container: node:24
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Sem Java (como o App Hosting)
        run: if command -v java || command -v javac; then echo "::error::este container tem Java"; exit 1; fi
      - name: npm ci
        run: npm ci
      - name: Nota fiscal carrega (validação de XML sem Java)
        run: npx vitest run src/lib/nfe

  # ── 1b) Ponta a ponta: compra completa num navegador de verdade ──────────
  # Sobe a loja contra os emuladores do Firebase e um simulador local da
  # AbacatePay (e2e/), sem nenhum segredo. Cliente entra, compra com PIX, o
  # webhook assinado confirma e o pedido aparece pago no painel.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Instalar JDK (emuladores do Firebase)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes ponta a ponta
        run: npm run e2e

      - name: Guardar rastros das falhas
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-resultados
          path: test-results/
          retention-days: 7

  # ── 2) Deploy de regras/índices/Storage: SÓ na main, único job com a chave ─
  # A service account (GOOGLE_APPLICATION_CREDENTIALS) só existe neste job, que
  # só roda em push/workflow_dispatch na main depois da validação acima passar.
  # `environment: production` permite proteger isso no GitHub (Settings ->
  # Environments -> production: restringir a branch main e, se quiser, exigir
  # aprovação), e guardar o segredo no ambiente em vez do repositório.
  deploy-firebase:
    name: deploy-firebase
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-firebase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Sem scripts de ciclo de vida e ANTES de existir qualquer segredo no
      # ambiente: nenhum pacote instalado roda código com a chave por perto.
      # Usa o firebase-tools travado no package-lock (antes era um
      # `npm install -g firebase-tools` sem versão, a cada deploy).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$HOME/sa.json"

      - name: Configurar CORS do bucket de Storage (upload direto do navegador)
        run: node scripts/set-bucket-cors.mjs "$HOME/sa.json"
        env:
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}

      - name: Deploy Firestore Rules
        run: GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json npx firebase deploy --only firestore:rules --project mikma-lencois

      - name: Deploy Firestore Indexes
        # A service account do CI ainda não tem a permissão de IAM pra gerenciar
        # índices (403 em collectionGroups/.../indexes). Até isso ser resolvido
        # no IAM do projeto, não deixamos essa falha travar o deploy do site -
        # é só um passo a mais de infra, não algo que quebra produção na hora.
        # Ver nota no fim do arquivo sobre como resolver a permissão.
        run: GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json npx firebase deploy --only firestore:indexes --project mikma-lencois
        continue-on-error: true

      - name: Deploy Storage Rules
        # continue-on-error mantido como rede de segurança: se faltar
        # alguma permissão de IAM específica do Storage no futuro, isso
        # não deve travar o deploy do site (que depende só do Firestore).
        run: GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json npx firebase deploy --only storage --project mikma-lencois
        continue-on-error: true

      - name: Remover a chave do disco
        if: always()
        run: rm -f "$HOME/sa.json"

# ── Nota: migração para o Firebase App Hosting ───────────────────────────────
# O deploy do site em si (hosting classico, "frameworksBackend") foi removido
# deste workflow. O App Hosting já está conectado direto ao GitHub e faz
# rollout automático a cada push nesta branch, de forma independente deste
# workflow (ver console do Firebase → App Hosting, ou migracao-app-hosting.md
# para o histórico completo da migração). Firestore rules/indexes e Storage
# rules continuam sendo deployados aqui, já que são serviços separados do
# hosting e não mudam com essa migração.

# ── Nota: permissão de índices do Firestore ──────────────────────────────────
# O passo "Deploy Firestore Indexes" acima falha com 403 porque a service
# account usada pelo CI (a mesma de FIREBASE_CLIENT_EMAIL/GOOGLE_APPLICATION_
# CREDENTIALS) não tem a role de IAM pra criar/editar índices compostos.
# Pra corrigir de vez (e então poder tirar o continue-on-error acima):
#   1. console.cloud.google.com/iam-admin/iam?project=mikma-lencois
#   2. Encontre a service account (o e-mail que está em FIREBASE_CLIENT_EMAIL)
#   3. Edite as permissões e adicione a role "Cloud Datastore Index Admin"
#      (roles/datastore.indexAdmin) -- ou, mais simples, "Firebase Admin"
#      (roles/firebase.admin), que já cobre isso e outras operações do CI.
#   4. Rode o workflow de novo (Actions -> Deploy -> Run workflow).
