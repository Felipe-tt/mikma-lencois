name: Deploy · Mikma Lençóis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Menor privilégio por padrão: o GITHUB_TOKEN só lê o conteúdo do repositório.
permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # ── 1) Validação: testes, regras do Firestore e build ──────────────────────
  # Este job é o check obrigatório "build-and-deploy" da regra do repositório e
  # roda em TODO evento (inclusive PRs). Ele NÃO recebe nenhum segredo de
  # produção. Antes, o job inteiro carregava FIREBASE_PRIVATE_KEY,
  # ABACATEPAY_API_KEY, RECAPTCHA_SECRET_KEY etc. e executava npm ci/test/build
  # do código do PR: qualquer pessoa capaz de abrir um PR (ou com um token
  # vazado) podia exfiltrar as chaves de produção editando um teste. O build
  # de produção passa com valores de mentira, porque só a parte NEXT_PUBLIC_*
  # (pública por natureza) é incorporada ao bundle e este workflow não publica
  # o site (quem faz isso é o App Hosting, com os segredos dele).
  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    env:
      # Placeholders: não são credenciais reais.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCiBuildPlaceholderNotARealKey000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:0:web:0
      FIREBASE_PROJECT_ID: ci-placeholder
      FIREBASE_CLIENT_EMAIL: ci-placeholder@ci-placeholder.iam.gserviceaccount.com
      NEXT_PUBLIC_APP_URL: https://mikma.com.br
      NEXT_PUBLIC_BASE_URL: https://mikma.com.br
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Rodar testes automatizados
        run: npm test

      - name: Lint (ESLint)
        run: npm run lint

      - name: Instalar JDK (exigido pelo emulador do Firestore)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Rodar testes das Firestore Rules
        run: npm run test:rules

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: nextjs-v3-webpack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.css', 'src/**/*.ts', 'src/**/*.tsx', 'tailwind.config.ts') }}
          # Sem restore-keys de propósito: um fallback por prefixo pode
          # restaurar um cache de webpack de um commit anterior quando o
          # hash exato não bate, e isso já causou pelo menos um chunk
          # compartilhado ficar desatualizado (código antigo servido em
          # produção mesmo após o fix estar no commit). Preferimos um
          # cache miss ocasional (build mais lenta) a servir código stale.

      - name: Build Next.js
        run: npm run build

  # ── 1a) Instala como o App Hosting: Node 24 sem Java ─────────────────────
  # O runner do GitHub já vem com JDK, então um pacote que precisa de Java no
  # "npm install" passava aqui e quebrava só no build do App Hosting (foi o
  # que aconteceu com a nota fiscal). Este job instala num container node:24,
  # que, como o builder do Google, não tem Java.
  instalar-como-app-hosting:
    name: instalar-como-app-hosting
    runs-on: ubuntu-latest
    container: node:24
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Sem Java (como o App Hosting)
        run: if command -v java || command -v javac; then echo "::error::este container tem Java"; exit 1; fi
      - name: npm ci
        run: npm ci
      - name: Nota fiscal carrega (validação de XML sem Java)
        run: npx vitest run src/lib/nfe

  # ── 1b) Ponta a ponta: compra completa num navegador de verdade ──────────
  # Sobe a loja contra os emuladores do Firebase e simuladores locais da
  # AbacatePay, dos Correios e do Melhor Envio (e2e/), sem nenhum segredo.
  # Cliente entra, compra com PIX, o webhook assinado confirma e o pedido
  # aparece pago no painel. A venda pelos Correios (PAC e SEDEX) vai do frete
  # do contrato ao despacho com rastreio e à entrega (e2e/tests/correios.spec.ts).
  e2e:
    name: e2e
    # Fixo no 24.04: o ubuntu-latest passou para o 26.04, onde o Playwright
    # ainda não instala o Chromium ("does not support chromium on ubuntu26.04").
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Instalar JDK (emuladores do Firebase)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes ponta a ponta
        run: npm run e2e

      - name: Guardar rastros das falhas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-resultados
          path: test-results/
          retention-days: 7

  # ── 2) Deploy de regras/índices/Storage: SÓ na main, único job com a chave ─
  # O acesso ao Google Cloud (identidade federada) só existe neste job, que
  # só roda em push/workflow_dispatch na main depois da validação acima passar.
  # `environment: production` permite proteger isso no GitHub (Settings ->
  # Environments -> production: restringir a branch main e, se quiser, exigir
  # aprovação), e guardar o segredo no ambiente em vez do repositório.
  deploy-firebase:
    name: deploy-firebase
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # identidade federada no Google Cloud
    concurrency:
      group: deploy-firebase
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Sem scripts de ciclo de vida e ANTES de existir qualquer segredo no
      # ambiente: nenhum pacote instalado roda código com a chave por perto.
      # Usa o firebase-tools travado no package-lock (antes era um
      # `npm install -g firebase-tools` sem versão, a cada deploy).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Entra no Google Cloud pela identidade federada: token de curta duração
      # emitido para este repositório, sem chave JSON guardada no GitHub.
      - name: Entrar no Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: mikma-lencois
          workload_identity_provider: projects/915579306587/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@mikma-lencois.iam.gserviceaccount.com

      - name: Configurar CORS do bucket de Storage (upload direto do navegador)
        run: node scripts/set-bucket-cors.mjs
        env:
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}

      - name: Deploy Firestore Rules
        run: npx firebase deploy --only firestore:rules --project mikma-lencois

      - name: Deploy Firestore Indexes
        # Sem continue-on-error: um índice que não sobe quebra as consultas
        # que dependem dele (FAILED_PRECONDITION em produção), então a falha
        # tem que aparecer. Índice de um campo só não vai no arquivo: o
        # Firestore já cria sozinho e recusa o deploy inteiro (HTTP 400).
        run: npx firebase deploy --only firestore:indexes --project mikma-lencois

      - name: Deploy Storage Rules
        # Sem continue-on-error: as regras do Storage limitam o que entra no
        # bucket (tipo e tamanho das fotos); uma falha aqui deixava as regras
        # antigas no ar sem ninguém ver. Precisa de roles/firebasestorage.viewer
        # (firebasestorage.defaultBucket.get) na conta do GitHub.
        run: npx firebase deploy --only storage --project mikma-lencois

# ── Nota: o site é publicado pelo Firebase App Hosting ───────────────────────
# O App Hosting está conectado direto ao GitHub e faz rollout automático a
# cada push nesta branch, independente deste workflow (ver console do
# Firebase → App Hosting). Regras e índices do Firestore e regras do Storage
# são serviços separados e continuam sendo publicados aqui.

# ── Nota: permissões do deploy-firebase ──────────────────────────────────────
# A conta do GitHub (firebase-adminsdk-fbsvc, pela identidade federada) usa:
# firebaserules.admin (regras), datastore.indexAdmin (índices),
# serviceusage.serviceUsageConsumer (o firebase-tools confere as APIs) e
# firebasestorage.viewer (bucket padrão, para as regras do Storage).
