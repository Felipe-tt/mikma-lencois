name: App Hosting · secrets

# Confere se cada secret do apphosting.yaml existe no Secret Manager, tem
# versão ativa e as permissões que o App Hosting precisa. Sem isso o erro só
# aparecia depois do merge, no rollout ("Secret configurado incorretamente").
# Roda na PR que mexe no apphosting.yaml, depois do merge e uma vez por dia
# (pega permissão removida por fora). Nunca lê o valor de um secret.
#
# Segurança: na PR usa pull_request_target, então o workflow e o script são
# os do main, não os da PR. O apphosting.yaml da PR é lido pela API do
# GitHub só como texto; nenhum código da PR é executado com acesso ao
# Google Cloud.

on:
  pull_request_target:
    branches: [main]
    paths: [apphosting.yaml]
  push:
    branches: [main]
    paths: [apphosting.yaml]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # identidade federada no Google Cloud

concurrency:
  group: secrets-app-hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conferir:
    name: secrets-app-hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.googleapis.com:443

      # Sempre o código do main (em pull_request_target o checkout padrão é a base).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            apphosting.yaml
          sparse-checkout-cone-mode: false

      - name: apphosting.yaml da PR (só como texto)
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$REPO/contents/apphosting.yaml?ref=$HEAD_SHA" -o "$RUNNER_TEMP/apphosting.yaml"

      - name: Entrar no Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: mikma-lencois
          workload_identity_provider: projects/915579306587/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@mikma-lencois.iam.gserviceaccount.com

      - name: Conferir os secrets
        env:
          ARQUIVO: ${{ github.event_name == 'pull_request_target' && format('{0}/apphosting.yaml', runner.temp) || 'apphosting.yaml' }}
        run: node scripts/check-apphosting-secrets.mjs "$ARQUIVO"
