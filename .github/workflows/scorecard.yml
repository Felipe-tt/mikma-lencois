name: OpenSSF Scorecard

# Nota de segurança do projeto (fixação de versões, permissões dos
# workflows, revisão de código, dependências...). O resultado aparece em
# Security > Code scanning e em https://scorecard.dev. Grátis.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard

      # Achados no log e no resumo (o alerta do Code scanning mostra só o primeiro local).
      - name: Achados no resumo
        if: always()
        run: |
          jq -r '.runs[0].results[] | "\(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri // "-"):\(.locations[0].physicalLocation.region.startLine // "-") | \(.message.text | gsub("\n"; " ") | .[0:400])"' results.sarif | tee -a "$GITHUB_STEP_SUMMARY"
