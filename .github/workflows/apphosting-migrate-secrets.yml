name: App Hosting - migrar secrets

# So roda quando disparado manualmente (aba Actions -> Run workflow).
# Nunca roda em push/PR. E seguro rodar mais de uma vez (idempotente:
# cria o secret se nao existir, ou so adiciona uma versao nova).
on:
  workflow_dispatch:

jobs:
  migrate-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Autenticar no Google Cloud
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project mikma-lencois
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Migrar secrets para o Secret Manager
        env:
          PROJECT_ID: mikma-lencois
          # firebase-tools (chamado pelo script) usa esta env var pra
          # autenticar via Application Default Credentials, sem precisar
          # de "firebase login" interativo. Caminho fixo criado no step
          # anterior (não usar $HOME, muda entre steps no runner).
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          ABACATEPAY_API_KEY: ${{ secrets.ABACATEPAY_API_KEY }}
          ABACATEPAY_WEBHOOK_SECRET: ${{ secrets.ABACATEPAY_WEBHOOK_SECRET }}
          MELHOR_ENVIO_TOKEN: ${{ secrets.MELHOR_ENVIO_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          STAFF_SESSION_SECRET: ${{ secrets.STAFF_SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          chmod +x scripts/migrate-secrets-to-secretmanager.sh
          scripts/migrate-secrets-to-secretmanager.sh
