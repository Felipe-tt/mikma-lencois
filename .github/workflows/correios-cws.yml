name: Correios · contrato e frete do site

# Garante que o frete pelo contrato dos Correios continua funcionando. Roda
# sozinho depois de cada deploy e todo dia de manhã, e confere duas coisas:
#
# 1. O contrato na API dos Correios: token pelo cartão de postagem e cotação
#    de PAC e SEDEX, com o secret CORREIOS_CWS ("login:codigo", criado à mão
#    no Secret Manager).
# 2. O site publicado: o servidor no ar consegue gerar o token e cotar pelo
#    contrato (/api/cron/health?correios=1). Depois de um deploy, espera o
#    App Hosting terminar de trocar a versão antes de conferir.
#
# Se o código de acesso for regerado ou o contrato vencer, o site cai no
# preço do Melhor Envio sem aviso nenhum. Aqui a rotina fica vermelha e abre
# um aviso nas Issues (chega por e-mail); quando volta ao normal, fecha.
# Só resultado sai no log (repositório público), nunca o login ou o código.

on:
  workflow_run:
    workflows: ['Deploy · Mikma Lençóis']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 11 * * *' # 08:17 em Brasília
  workflow_dispatch:
    inputs:
      permissao:
        description: 'Dar ao site acesso ao secret CORREIOS_CWS (só se o secret for recriado)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  id-token: write # identidade federada no Google Cloud

concurrency:
  group: correios-contrato
  cancel-in-progress: false

jobs:
  correios:
    name: Correios
    # Deploy que falhou não troca a versão do site: nada novo para conferir.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_ID: mikma-lencois
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            *.blob.core.windows.net:443
            nodejs.org:443
            *.googleapis.com:443
            api.correios.com.br:443
            mikma.com.br:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Entrar no Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: mikma-lencois
          workload_identity_provider: projects/915579306587/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@mikma-lencois.iam.gserviceaccount.com

      # Mesmas permissões de um secret que o site já lê (viewer e
      # secretVersionManager da conta do App Hosting).
      - name: Acesso do site ao secret
        if: github.event_name == 'workflow_dispatch' && inputs.permissao
        run: |
          gcloud secrets get-iam-policy ABACATEPAY_API_KEY --format=json | jq 'del(.etag)' > /tmp/policy.json
          gcloud secrets set-iam-policy CORREIOS_CWS /tmp/policy.json >/dev/null && echo "permissões copiadas"

      - name: Conferir o contrato na API dos Correios
        id: contrato
        run: |
          if ! valor=$(gcloud secrets versions access latest --secret=CORREIOS_CWS 2>/dev/null) || [ -z "$valor" ]; then
            echo "Não deu para ler o secret CORREIOS_CWS."
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "detail=não deu para ler o secret CORREIOS_CWS no Secret Manager" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$valor"
          echo "::add-mask::${valor#*:}"
          echo "::add-mask::${valor%%:*}"
          CORREIOS_CWS="$valor" CARTAO=0075520150 CONTRATO=9912490489 node scripts/correios-cws-teste.mjs || true

      # O workflow de deploy termina antes de o App Hosting trocar a versão.
      - name: Esperar a versão nova ficar no ar
        if: github.event_name == 'workflow_run'
        env:
          SINCE: ${{ github.event.workflow_run.created_at }}
        run: |
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          node scripts/apphosting-wait-rollout.mjs

      # Depois de um deploy, a versão nova pode levar uns minutos para entrar
      # no ar: tenta por até ~15 min (versão antiga só dá "sem conclusão").
      - name: Conferir o frete no site publicado
        id: site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TENTATIVAS: ${{ github.event_name == 'workflow_run' && '20' || '3' }}
          PAUSA_S: ${{ github.event_name == 'workflow_run' && '45' || '30' }}
        run: node scripts/correios-site-check.mjs || true

      - name: Avisar nas Issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRATO: ${{ steps.contrato.outputs.verdict }}
          CONTRATO_DETALHE: ${{ steps.contrato.outputs.detail }}
          SITE: ${{ steps.site.outputs.verdict }}
          SITE_DETALHE: ${{ steps.site.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=correios-contrato
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$CONTRATO" = "fail" ] || [ "$SITE" = "fail" ]; then
            body="O frete pelo contrato dos Correios **não está funcionando**. O site continua vendendo, com o preço do Melhor Envio no lugar."
            if [ "$CONTRATO" = "fail" ]; then body="$body"$'\n\n'"- Contrato na API dos Correios: $CONTRATO_DETALHE."; fi
            if [ "$SITE" = "fail" ]; then body="$body"$'\n\n'"- Site publicado: $SITE_DETALHE."; fi
            body="$body"$'\n\n'"Se o código de acesso foi regerado no CWS, crie uma versão nova do secret \`CORREIOS_CWS\` no Secret Manager, no formato \`login:codigo\`."
            body="$body"$'\n\n'"Detalhes: $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh label create "$label" --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Frete pelo contrato dos Correios falhando (monitor automático)" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Frete pelo contrato dos Correios com falha" --label "$label" --body "$body"
            fi
          elif [ "$CONTRATO" = "ok" ] && [ "$SITE" = "ok" ] && [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Voltou ao normal: $SITE_DETALHE. Detalhes: $RUN_URL"
          fi

      - name: Resultado
        if: ${{ !cancelled() }}
        env:
          CONTRATO: ${{ steps.contrato.outputs.verdict }}
          SITE: ${{ steps.site.outputs.verdict }}
        run: |
          echo "contrato: ${CONTRATO:-sem resultado} · site: ${SITE:-sem resultado}"
          if [ "$CONTRATO" != "ok" ] || [ "$SITE" = "fail" ]; then exit 1; fi
